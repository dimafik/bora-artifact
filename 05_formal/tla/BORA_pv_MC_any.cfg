\* Finite instance for the per-voter exclusion check.  N=3 is the smallest
\* size at which the self-vote gap is visible: majority 2, so a quorum that
\* counts the candidate leaves a single peer refusing.
SPECIFICATION Spec

CONSTANTS
    N = 3
    F = 2
    MaxTerm = 1
    Values = {v1}
    Orderers = {1, 2, 3}

CONSTRAINT MCConstraint

PROPERTY ExclusionAny
