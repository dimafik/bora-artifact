# Arm A — Raft baseline (BRAO_DISABLE=1, vanilla FIFO batch cut)
test:
  name: sched-bft-arm-a-raft
  description: AWS 5h live run, Raft baseline
  workers:
    type: local
    number: 8
  rounds:
    - label: warmup
      txDuration: 60
      rateControl: { type: linear-rate, opts: { startingTps: 10, finishingTps: 100 } }
      workload: { module: ../workloads/transfer.js, arguments: { assets: 100000, criticality: low } }

    - &measurement
      label: arm_a_round_1
      txDuration: 600
      rateControl:
        type: composite-rate
        opts:
          weights: [70, 15, 15]
          rateControllers:
            - { type: fixed-rate, opts: { tps: 70 } }
            - { type: fixed-rate, opts: { tps: 15 } }
            - { type: fixed-rate, opts: { tps: 15 } }
      workload:
        module: ../workloads/transfer.js
        arguments: { assets: 100000, criticality: low }

    - <<: *measurement
      label: arm_a_round_2
    - <<: *measurement
      label: arm_a_round_3
    - <<: *measurement
      label: arm_a_round_4
    - <<: *measurement
      label: arm_a_round_5
    - <<: *measurement
      label: arm_a_round_6
