# E1 clean: no delay, advisor off. The single-host reference condition.
test:
  name: bora-multihost-e1-clean
  description: multi-host throughput/latency, clean baseline, no injected delay
  workers:
    type: local
    number: 8
  rounds:
    - label: warmup
      txDuration: 60
      rateControl: { type: linear-rate, opts: { startingTps: 10, finishingTps: 100 } }
      workload: { module: ../workloads/transfer.js, arguments: { assets: 100000, criticality: low } }

    - &measurement
      label: e1_round_1
      txDuration: 600
      rateControl:
        type: composite-rate
        opts:
          weights: [70, 15, 15]
          rateControllers:
            - { type: fixed-rate, opts: { tps: 70 } }
            - { type: fixed-rate, opts: { tps: 15 } }
            - { type: fixed-rate, opts: { tps: 15 } }
      workload:
        module: ../workloads/transfer.js
        arguments: { assets: 100000, criticality: low }

    - <<: *measurement
      label: e1_round_2
    - <<: *measurement
      label: e1_round_3
    - <<: *measurement
      label: e1_round_4
    - <<: *measurement
      label: e1_round_5
    - <<: *measurement
      label: e1_round_6
