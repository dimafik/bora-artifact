---
# Phase 3 (T+2:45 → T+3:00): Toggle to Arm C ablation
# BRAO_DISABLE=1 — orderer skips sidecar call, falls back to FIFO,
# but tx criticality field is still honored by PSR scheduler.
- name: Disable BRAO sidecar
  hosts: orderers
  tasks:
    - name: Flip BRAO_DISABLE=1
      ansible.builtin.lineinfile:
        path: /opt/fabric/orderer.env
        regexp: '^BRAO_DISABLE='
        line: 'BRAO_DISABLE=1'

    - name: Restart orderer (rolling)
      community.docker.docker_compose_v2:
        project_src: /opt/fabric
        files: [orderer-compose.yml]
        state: present
        recreate: always
      throttle: 1

    - name: Wait for re-stabilization
      ansible.builtin.pause: { seconds: 15 }

    - name: Confirm sidecar bypass via probe metric
      ansible.builtin.uri:
        url: http://127.0.0.1:9095/metrics
        return_content: true
      register: probes
      failed_when: "'predictor_bypass_total' not in probes.content"
