name: D2-5node-Fabric-Network
version: "2.0.0"

caliper:
  blockchain: fabric
  sutOptions:
    mutualTls: false

channels:
  - channelName: mychannel
    contracts:
      - id: basic

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: 'User1'
          clientPrivateKey:
            path: '/cryptoMount/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/priv_sk'
          clientSignedCert:
            path: '/cryptoMount/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem'
    connectionProfile:
      path: 'networks/connection-org1.json'
      discover: true
  - mspid: Org2MSP
    identities:
      certificates:
        - name: 'User1'
          clientPrivateKey:
            path: '/cryptoMount/peerOrganizations/org2.example.com/users/User1@org2.example.com/msp/keystore/priv_sk'
          clientSignedCert:
            path: '/cryptoMount/peerOrganizations/org2.example.com/users/User1@org2.example.com/msp/signcerts/User1@org2.example.com-cert.pem'
    connectionProfile:
      path: 'networks/connection-org2.json'
      discover: true
