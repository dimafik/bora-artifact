test:
  name: D2-Saturation-Refinement
  description: >
    Sweep between rate-500 (sustained in η) and rate-1000 (45% timeout in β)
    to identify the exact saturation point of the 5-orderer Raft cluster.
  workers:
    number: 8
  rounds:
    - label: rate-600
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 600
      workload:
        module: workload/createAsset.js
    - label: rate-700
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 700
      workload:
        module: workload/createAsset.js
    - label: rate-800
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 800
      workload:
        module: workload/createAsset.js
    - label: rate-900
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 900
      workload:
        module: workload/createAsset.js
